<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evidence Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;0,900;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b0f;
      --panel: #12141b;
      --panel-2: #0e1016;
      --border: #242732;
      --border-soft: #1c1f28;
      --text: #e9e7e0;
      --text-dim: #8b8d98;
      --text-faint: #565a68;
      --gold: #d4a853;
      --gold-soft: rgba(212, 168, 83, 0.10);
      --gold-border: rgba(212, 168, 83, 0.45);
      --red: #e0685a;
      --red-soft: rgba(224, 104, 90, 0.10);
      --blue: #6f9fd8;
      --blue-soft: rgba(111, 159, 216, 0.10);
      --green: #7cae82;
      --teal: #4d7468;
      --teal-hover: #5a8579;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      height: 100%;
    }

    body {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: 'Source Serif 4', serif;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: 230px;
      flex: 0 0 230px;
      background: var(--panel-2);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      padding: 22px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 6px 22px 6px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border: 1px solid var(--gold-border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-family: 'Source Serif 4', serif;
      font-weight: 700;
      font-size: 14px;
      flex: 0 0 34px;
    }

    .brand-name {
      font-family: 'Source Serif 4', serif;
      font-weight: 700;
      font-size: 15px;
      line-height: 1.15;
    }

    .brand-sub {
      color: var(--text-faint);
      font-size: 9.5px;
      letter-spacing: .03em;
      margin-top: 2px;
    }

    nav.navlist {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 6px;
      flex: 1;
    }

    .navitem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      border-left: 2px solid transparent;
      font-size: 12.5px;
      letter-spacing: .01em;
      transition: background .12s, color .12s;
      user-select: none;
    }

    .navitem svg {
      flex: 0 0 15px;
      width: 15px;
      height: 15px;
      opacity: .85;
    }

    .navitem:hover {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
    }

    .navitem.active {
      background: var(--gold-soft);
      color: var(--gold);
      border-left: 2px solid var(--gold);
    }

    .navitem.active svg {
      opacity: 1;
    }

    .nav-divider {
      height: 1px;
      background: var(--border-soft);
      margin: 10px 4px;
    }

    .nav-label {
      color: var(--text-faint);
      font-size: 9.5px;
      letter-spacing: .08em;
      padding: 10px 10px 4px 10px;
    }

    .sidebar-foot {
      border-top: 1px solid var(--border-soft);
      padding-top: 12px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text-faint);
      font-size: 10.5px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      flex: 0 0 7px;
    }

    /* ---------- MAIN ---------- */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 30px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg);
    }

    .topbar-title h1 {
      font-size: 24px;
      margin: 0;
      font-weight: 700;
    }

    .topbar-title p {
      margin: 4px 0 0 0;
      color: var(--text-dim);
      font-size: 11.5px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-dim);
      font-size: 11px;
      margin-right: 8px;
    }

    .btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      padding: 9px 15px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all .12s;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--text-dim);
    }

    .btn-solid {
      background: var(--text);
      color: #0a0b0f;
      border-color: var(--text);
      font-weight: 600;
    }

    .btn-solid:hover {
      background: #fff;
    }

    .btn-teal {
      background: var(--teal);
      border-color: var(--teal);
      color: #eef4f1;
    }

    .btn-teal:hover {
      background: var(--teal-hover);
    }

    .btn-red {
      border-color: rgba(224, 104, 90, 0.5);
      color: var(--red);
      background: transparent;
    }

    .btn-red:hover {
      background: var(--red-soft);
    }

    .content {
      padding: 26px 30px 60px 30px;
      flex: 1;
      overflow-y: auto;
    }

    /* ---------- STAT ROW ---------- */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 1px;
      background: var(--border-soft);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .stat {
      background: var(--panel);
      padding: 20px 18px;
    }

    .stat .num {
      font-family: 'Source Serif 4', serif;
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
    }

    .stat .lbl {
      color: var(--text-dim);
      font-size: 9.5px;
      letter-spacing: .06em;
      margin-top: 8px;
    }

    .num.red {
      color: var(--red);
    }

    .num.green {
      color: var(--green);
    }

    .num.gold {
      color: var(--gold);
    }

    /* ---------- CARDS / PANELS ---------- */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .section-title {
      color: var(--text-faint);
      font-size: 10px;
      letter-spacing: .08em;
      margin-bottom: 12px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 22px;
      align-items: start;
    }

    .case-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color .12s, transform .12s;
    }

    .case-card:hover {
      border-color: var(--text-dim);
    }

    .case-card.selected {
      border-color: var(--gold-border);
      background: linear-gradient(180deg, rgba(212, 168, 83, 0.06), transparent);
    }

    .case-card .row1 {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .case-card .issue-id {
      color: var(--text-faint);
      font-size: 10.5px;
    }

    .case-card .score {
      font-family: 'Source Serif 4', serif;
      font-size: 20px;
      font-weight: 700;
    }

    .case-card .title {
      font-family: 'Source Serif 4', serif;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .case-card .meta {
      color: var(--text-dim);
      font-size: 10.5px;
      margin-left: 8px;
    }

    .case-card .status {
      color: var(--text-faint);
      font-style: italic;
      font-size: 11px;
      margin-top: 8px;
      font-family: 'Source Serif 4', serif;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      letter-spacing: .03em;
      border: 1px solid;
      font-weight: 600;
    }

    .badge-high {
      color: var(--gold);
      border-color: var(--gold-border);
      background: var(--gold-soft);
    }

    .badge-medium {
      color: var(--blue);
      border-color: rgba(111, 159, 216, .45);
      background: var(--blue-soft);
    }

    .badge-low {
      color: var(--text-dim);
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.02);
    }

    .tag {
      display: inline-flex;
      padding: 5px 11px;
      border-radius: 5px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
    }

    .detail-header {
      padding: 24px 26px 0 26px;
    }

    .detail-eyebrow {
      color: var(--text-faint);
      font-size: 10.5px;
      letter-spacing: .05em;
      margin-bottom: 10px;
    }

    .detail-title {
      font-size: 28px;
      margin: 0 0 16px 0;
    }

    .detail-badges {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .hr {
      height: 1px;
      background: var(--border-soft);
      margin: 0 26px;
    }

    .breakdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 22px 26px;
    }

    .breakdown .num {
      font-family: 'Source Serif 4', serif;
      font-size: 26px;
      font-weight: 700;
    }

    .breakdown .lbl {
      color: var(--text-dim);
      font-size: 9.5px;
      letter-spacing: .05em;
      margin-top: 6px;
    }

    .exhibits {
      padding: 6px 26px 26px 26px;
    }

    .exhibit-title {
      color: var(--text-faint);
      font-size: 10.5px;
      letter-spacing: .05em;
      margin-bottom: 14px;
    }

    .quote {
      border-left: 2px solid var(--gold-border);
      padding: 2px 0 2px 16px;
      margin-bottom: 16px;
      font-family: 'Source Serif 4', serif;
      font-style: italic;
      font-size: 15px;
      color: #ddd9cf;
      line-height: 1.5;
    }

    /* ---------- EVIDENCE TABLE ---------- */
    table.evidence {
      width: 100%;
      border-collapse: collapse;
    }

    table.evidence th {
      text-align: left;
      color: var(--text-faint);
      font-size: 9.5px;
      letter-spacing: .06em;
      font-weight: 500;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-soft);
    }

    table.evidence td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 12px;
      color: var(--text-dim);
      vertical-align: top;
    }

    table.evidence tr:hover td {
      background: rgba(255, 255, 255, 0.015);
    }

    table.evidence td.quote-cell {
      color: var(--text);
      font-family: 'Source Serif 4', serif;
      font-style: italic;
      font-size: 13.5px;
      max-width: 420px;
    }

    .chip {
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 9.5px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* ---------- ANALYTICS ---------- */
    .chart-panel {
      padding: 22px 24px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .bar-label {
      width: 120px;
      font-size: 11px;
      color: var(--text-dim);
      flex: 0 0 120px;
    }

    .bar-track {
      flex: 1;
      height: 10px;
      background: var(--border-soft);
      border-radius: 5px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--gold));
      border-radius: 5px;
    }

    .bar-val {
      width: 34px;
      text-align: right;
      font-size: 11px;
      color: var(--text-dim);
      flex: 0 0 34px;
    }

    /* ---------- CHAT ---------- */
    .chat-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 145px);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 72%;
      padding: 12px 15px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.55;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--gold-soft);
      border: 1px solid var(--gold-border);
      color: #f2e9d4;
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--panel-2);
      border: 1px solid var(--border-soft);
      color: var(--text);
    }

    .msg.assistant b,
    .msg.user b {
      color: var(--gold);
    }

    .msg-meta {
      font-size: 9.5px;
      color: var(--text-faint);
      margin-bottom: 5px;
      letter-spacing: .04em;
    }

    .chat-input-row {
      border-top: 1px solid var(--border-soft);
      padding: 16px 20px;
      display: flex;
      gap: 10px;
    }

    .chat-input-row textarea {
      flex: 1;
      resize: none;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 11px 13px;
      outline: none;
      min-height: 44px;
      max-height: 120px;
    }

    .chat-input-row textarea:focus {
      border-color: var(--gold-border);
    }

    .chat-suggest {
      display: flex;
      gap: 8px;
      padding: 0 20px 14px 20px;
      flex-wrap: wrap;
    }

    .suggest-chip {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 10.5px;
      color: var(--text-dim);
      cursor: pointer;
    }

    .suggest-chip:hover {
      border-color: var(--gold-border);
      color: var(--gold);
    }

    .typing-dots span {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: var(--text-dim);
      border-radius: 50%;
      margin-right: 3px;
      animation: blink 1.2s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {

      0%,
      80%,
      100% {
        opacity: .25;
      }

      40% {
        opacity: 1;
      }
    }

    /* ---------- UPLOAD ---------- */
    .dropzone {
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      padding: 60px 20px;
      text-align: center;
      color: var(--text-dim);
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .dropzone.drag {
      border-color: var(--gold-border);
      background: var(--gold-soft);
    }

    .dropzone svg {
      margin-bottom: 14px;
      opacity: .7;
    }

    .dropzone .dz-title {
      font-family: 'Source Serif 4', serif;
      font-size: 17px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .dropzone .dz-sub {
      font-size: 11px;
      color: var(--text-faint);
    }

    .file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 7px;
      margin-top: 10px;
      background: var(--panel);
    }

    .file-row .fname {
      font-size: 12.5px;
      color: var(--text);
    }

    .file-row .fsize {
      font-size: 10.5px;
      color: var(--text-faint);
      margin-top: 3px;
    }

    .file-status {
      font-size: 10px;
      padding: 4px 9px;
      border-radius: 4px;
      border: 1px solid;
    }

    .fs-queued {
      color: var(--text-dim);
      border-color: var(--border);
    }

    .fs-processing {
      color: var(--blue);
      border-color: rgba(111, 159, 216, .45);
      background: var(--blue-soft);
      animation: pulse-border 1.5s infinite ease-in-out;
    }

    .fs-done {
      color: var(--green);
      border-color: rgba(124, 174, 130, .45);
      background: rgba(124, 174, 130, 0.08);
    }

    .fs-error {
      color: var(--red);
      border-color: rgba(224, 104, 90, .45);
      background: var(--red-soft);
    }

    @keyframes pulse-border {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    .progress-track {
      width: 140px;
      height: 6px;
      background: var(--border-soft);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      background: var(--teal);
      transition: width .3s ease;
    }

    .analysis-result-card {
      margin-top: 14px;
      padding: 16px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .analysis-result-card.success {
      border-color: rgba(124, 174, 130, 0.35);
    }

    .analysis-badge-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .analysis-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .analysis-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 11.5px;
      color: var(--text-dim);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
    }

    .analysis-meta-item strong {
      color: var(--text);
    }

    .analysis-cases-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .analysis-case-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .analysis-case-item:hover {
      border-color: var(--gold-border);
    }

    .analysis-case-title {
      font-size: 12px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .analysis-case-title .case-id-tag {
      color: var(--gold);
      font-size: 11px;
    }

    .analysis-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 11px;
    }

    /* ---------- SETTINGS ---------- */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 820px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      color: var(--text-dim);
      font-size: 10.5px;
      letter-spacing: .04em;
      margin-bottom: 7px;
    }

    .field input[type=text] {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
      outline: none;
    }

    .field input[type=text]:focus {
      border-color: var(--gold-border);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-soft);
    }

    .toggle-row .t-title {
      font-size: 12.5px;
      color: var(--text);
    }

    .toggle-row .t-sub {
      font-size: 10.5px;
      color: var(--text-faint);
      margin-top: 3px;
    }

    .switch {
      width: 38px;
      height: 21px;
      border-radius: 11px;
      background: var(--border);
      position: relative;
      cursor: pointer;
      flex: 0 0 38px;
      transition: background .15s;
    }

    .switch.on {
      background: var(--teal);
    }

    .switch .knob {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: left .15s;
    }

    .switch.on .knob {
      left: 20px;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-faint);
    }

    .empty-state .serif {
      font-size: 16px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">EB</div>
        <div>
          <div class="brand-name">Evidence Board</div>
          <div class="brand-sub">Customer intelligence</div>
        </div>
      </div>
      <nav class="navlist" id="navlist"></nav>
      <div class="sidebar-foot">
        <span class="dot"></span> Live · 127.0.0.1:8000
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-sub">Customer intelligence → root cause → prioritized action</p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </div>
      <div class="content" id="page-root"></div>
    </div>
  </div>

  <script src="assistant.js?v=2"></script>
  <script>
    /* ============================= ICONS ============================= */
    const ICONS = {
      dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1.2"/><rect x="14" y="3" width="7" height="5" rx="1.2"/><rect x="14" y="12" width="7" height="9" rx="1.2"/><rect x="3" y="16" width="7" height="5" rx="1.2"/></svg>',
      cases: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>',
      evidence: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 8h10M7 12h10M7 16h6"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>',
      analytics: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>',
      assistant: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12a8 8 0 1 1-3.4-6.55"/><path d="M21 5v5h-5"/><circle cx="9" cy="12" r="0.7" fill="currentColor"/><circle cx="13" cy="12" r="0.7" fill="currentColor"/></svg>',
      upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
      settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.1.36.5 1 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>',
    };

    /* ============================= DATA ============================= */
    let CASES = [];
    let DASHBOARD_STATS = null;
    let OUTCOMES = [];

    const STATUS_MAP = {
      pending_review: "Awaiting review",
      approved: "In progress",
      rejected: "Dismissed",
      resolved: "Resolved",
      needs_reanalysis: "Reopened",
    };

    const TREND = [4, 6, 5, 8, 7, 9, 11, 10, 13, 12, 15, 17]; // Mock trend for chart

    /* ============================= STATE ============================= */
    let state = { page: 'dashboard', selectedCase: null, chatHistory: [], uploadedFiles: [] };

    async function fetchData() {
      try {
        const dRes = await fetch("http://127.0.0.1:8000/dashboard");
        if (dRes.ok) DASHBOARD_STATS = await dRes.json();
        
        const iRes = await fetch("http://127.0.0.1:8000/issues");
        if (iRes.ok) {
            const data = await iRes.json();
            CASES = data.issues || [];
            if (!state.selectedCase && CASES.length > 0) {
                state.selectedCase = CASES[0].issue_id;
            }
        }
        
        route();
      } catch (err) {
        console.error("Failed to fetch data", err);
      }
    }

    const NAV = [
      { id: 'dashboard', label: 'Dashboard', icon: 'dashboard' },
      { id: 'cases', label: 'Cases', icon: 'cases' },
      { id: 'evidence', label: 'Evidence Log', icon: 'evidence' },
      { id: 'analytics', label: 'Analytics', icon: 'analytics' },
      { id: 'assistant', label: 'AI Assistant', icon: 'assistant' },
      { id: 'upload', label: 'File Upload', icon: 'upload' },
      { id: 'settings', label: 'Settings', icon: 'settings' },
    ];

    function renderNav() {
      document.getElementById('navlist').innerHTML = NAV.map(n => `
    <div class="navitem ${state.page === n.id ? 'active' : ''}" data-nav="${n.id}">
      ${ICONS[n.icon]}<span>${n.label}</span>
    </div>`).join('');
      document.querySelectorAll('.navitem').forEach(el => {
        el.addEventListener('click', () => { state.page = el.getAttribute('data-nav'); route(); });
      });
    }

    function badgeClass(sev) { 
      const s = (sev || '').toUpperCase();
      return s === 'HIGH' || s === 'CRITICAL' ? 'badge-high' : s === 'MEDIUM' ? 'badge-medium' : 'badge-low'; 
    }

    /* ============================= ROUTER ============================= */
    const TITLES = {
      dashboard: ['Dashboard', 'Customer intelligence → root cause → prioritized action'],
      cases: ['Priority Backlog', 'All open cases ranked by composite priority score'],
      evidence: ['Evidence Log', 'Raw feedback exhibits linked to active cases'],
      analytics: ['Analytics', 'Trends across channels, severity and recurrence'],
      assistant: ['AI Assistant', 'Ask questions about cases, evidence and root causes'],
      upload: ['File Upload', 'Import feedback exports for automatic case linking'],
      settings: ['Settings', 'Connections, notifications and workspace preferences'],
    };

    function route() {
      renderNav();
      document.getElementById('page-title').textContent = TITLES[state.page][0];
      document.getElementById('page-sub').textContent = TITLES[state.page][1];
      renderTopActions();
      const root = document.getElementById('page-root');
      if (state.page === 'dashboard') root.innerHTML = pageDashboard();
      if (state.page === 'cases') root.innerHTML = pageCases();
      if (state.page === 'evidence') root.innerHTML = pageEvidence();
      if (state.page === 'analytics') root.innerHTML = pageAnalytics();
      if (state.page === 'assistant') root.innerHTML = pageAssistant();
      if (state.page === 'upload') root.innerHTML = pageUpload();
      if (state.page === 'settings') root.innerHTML = pageSettings();
      afterRender();
    }

    function renderTopActions() {
      const actions = document.getElementById('topbar-actions');
      if (state.page === 'upload') {
        actions.innerHTML = `<button class="btn btn-teal" id="btn-browse">Browse files</button>`;
        return;
      }
      if (state.page === 'assistant') {
        actions.innerHTML = `<button class="btn" id="btn-clear-chat">Clear conversation</button>`;
        return;
      }
      actions.innerHTML = `
    <div class="status-pill"><span class="dot"></span> http://127.0.0.1:8000</div>
    <button class="btn btn-solid" onclick="apiAction('/seed')">Load demo data</button>
    <button class="btn btn-teal" onclick="apiAction('/analyze')">Run analysis</button>
    <button class="btn btn-red" id="btn-reset" onclick="apiAction('/reset')">Reset</button>`;
    }

    async function apiAction(endpoint) {
      try {
        await fetch("http://127.0.0.1:8000" + endpoint, { method: "POST" });
        await fetchData();
      } catch (e) { console.error(e); }
    }

    /* ============================= DASHBOARD ============================= */
    function pageDashboard() {
      if (!DASHBOARD_STATS) return `<div style="padding:40px;text-align:center;">Loading...</div>`;
      const sel = CASES.find(c => c.issue_id === state.selectedCase) || CASES[0] || null;
      return `
    <div class="stat-row">
      <div class="stat"><div class="num">${DASHBOARD_STATS.total_feedback || 0}</div><div class="lbl">TOTAL FEEDBACK</div></div>
      <div class="stat"><div class="num">${DASHBOARD_STATS.total_issues || 0}</div><div class="lbl">OPEN CASES</div></div>
      <div class="stat"><div class="num red">${DASHBOARD_STATS.critical_issue_count || 0}</div><div class="lbl">CRITICAL</div></div>
      <div class="stat"><div class="num">${DASHBOARD_STATS.recurring_issue_count || 0}</div><div class="lbl">RECURRING</div></div>
      <div class="stat"><div class="num green">${DASHBOARD_STATS.resolved_issue_count || 0}</div><div class="lbl">RESOLVED</div></div>
      <div class="stat"><div class="num gold">${DASHBOARD_STATS.analysis_runs || 0}</div><div class="lbl">ANALYSIS RUNS</div></div>
    </div>
    <div class="grid-2">
      <div>
        <div class="section-title">PRIORITY BACKLOG</div>
        ${CASES.map(c => caseCardHTML(c, sel && c.issue_id === sel.issue_id)).join('')}
      </div>
      <div class="panel">${sel ? caseDetailHTML(sel) : '<div class="empty-state">No cases available.</div>'}</div>
    </div>
  `;
    }

    function caseCardHTML(c, selected) {
      return `
  <div class="case-card ${selected ? 'selected' : ''}" data-case="${c.issue_id}">
    <div class="row1">
      <span class="issue-id">${c.issue_id}</span>
      <span class="score" style="color:${selected ? 'var(--gold)' : 'var(--text)'}">${c.priority_score ? c.priority_score.toFixed(1) : '0'}</span>
    </div>
    <div class="title">${c.label}</div>
    <span class="badge ${badgeClass(c.priority_label)}">${c.priority_label}</span>
    <span class="meta">${c.feedback_count} exhibits · ${(c.channels || []).length} channels</span>
    <div class="status">${STATUS_MAP[c.status] || c.status}</div>
  </div>`;
    }

    function caseDetailHTML(c) {
      return `
    <div class="detail-header">
      <div class="detail-eyebrow">CASE FILE · ${c.issue_id}</div>
      <h2 class="detail-title">${c.label}</h2>
      <div class="detail-badges">
        <span class="badge ${badgeClass(c.priority_label)}">${c.priority_label} · ${c.priority_score ? c.priority_score.toFixed(1) : '0'}/100</span>
        ${c.journey ? `<span class="tag">${c.journey}</span>` : ''}
        ${c.feature ? `<span class="tag">${c.feature}</span>` : ''}
      </div>
    </div>
    <div class="hr"></div>
    <div class="breakdown">
      <div><div class="num">${c.priority_breakdown?.customer_impact || 0}</div><div class="lbl">CUSTOMER IMPACT</div></div>
      <div><div class="num">${c.priority_breakdown?.business_impact || 0}</div><div class="lbl">BUSINESS IMPACT</div></div>
      <div><div class="num">${c.priority_breakdown?.recurrence_score || 0}</div><div class="lbl">RECURRENCE</div></div>
      <div><div class="num">${c.priority_breakdown?.evidence_confidence || 0}</div><div class="lbl">EVIDENCE CONFIDENCE</div></div>
    </div>
    <div class="hr"></div>
    <div class="exhibits">
      <div class="exhibit-title" style="margin-top:18px;">EXHIBITS — CUSTOMER EVIDENCE</div>
      ${(c.evidence_sample || []).map(q => `<div class="quote">"${q}"</div>`).join('')}
    </div>
  `;
    }

    /* ============================= CASES PAGE ============================= */
    function pageCases() {
      const sel = CASES.find(c => c.issue_id === state.selectedCase) || CASES[0];
      return `
    <div class="grid-2">
      <div>
        <div class="section-title">ALL CASES (${CASES.length})</div>
        ${CASES.map(c => caseCardHTML(c, sel && c.issue_id === sel.issue_id)).join('')}
      </div>
      <div class="panel">${sel ? caseDetailHTML(sel) : '<div class="empty-state">No cases available.</div>'}</div>
    </div>
  `;
    }

    /* ============================= EVIDENCE PAGE ============================= */
    function pageEvidence() {
      // Flatten all evidence from all cases
      const ev = [];
      CASES.forEach(c => {
         if(c.evidence_sample) {
            c.evidence_sample.forEach((q, i) => {
               ev.push({
                 channel: (c.channels || [])[i % (c.channels||['UNKNOWN']).length] || 'UNKNOWN',
                 quote: q,
                 case: c.label,
                 sentiment: 'Negative',
                 date: new Date(c.created_at || Date.now()).toLocaleDateString()
               });
            });
         }
      });
      return `
    <div class="panel">
      <table class="evidence">
        <thead><tr><th>CHANNEL</th><th>EXHIBIT</th><th>LINKED CASE</th><th>SENTIMENT</th><th>DATE</th></tr></thead>
        <tbody>
          ${ev.map(e => `
            <tr>
              <td><span class="chip">${e.channel}</span></td>
              <td class="quote-cell">"${e.quote}"</td>
              <td>${e.case}</td>
              <td>${e.sentiment}</td>
              <td>${e.date}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
    }

    /* ============================= ANALYTICS PAGE ============================= */
    function pageAnalytics() {
      const channelCounts = {};
      CASES.forEach(c => {
         (c.channels || []).forEach(ch => {
             channelCounts[ch] = (channelCounts[ch] || 0) + 1;
         });
      });
      const channelArr = Object.entries(channelCounts).sort((a,b)=>b[1]-a[1]);
      const maxCh = Math.max(...channelArr.map(c => c[1]), 1);
      
      const maxT = Math.max(...TREND);
      const pts = TREND.map((v, i) => `${(i / (TREND.length - 1)) * 560},${70 - (v / maxT) * 60}`).join(' ');
      
      const tags = [...new Set(CASES.flatMap(c => [c.journey, c.feature]).filter(Boolean))];

      return `
    <div class="grid-2" style="grid-template-columns:1fr 1fr;">
      <div class="panel chart-panel">
        <div class="section-title">FEEDBACK BY CHANNEL</div>
        ${channelArr.map(([label, val]) => `
          <div class="bar-row">
            <div class="bar-label">${label}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(val / maxCh) * 100}%"></div></div>
            <div class="bar-val">${val}</div>
          </div>`).join('')}
      </div>
      <div class="panel chart-panel">
        <div class="section-title">SEVERITY DISTRIBUTION</div>
        ${['High', 'Medium', 'Low'].map(sev => {
        const count = CASES.filter(c => c.priority_label === sev).length;
        return `<div class="bar-row">
            <div class="bar-label">${sev.toUpperCase()}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${CASES.length ? (count / CASES.length) * 100 : 0}%"></div></div>
            <div class="bar-val">${count}</div>
          </div>`;
      }).join('')}
        <div class="section-title" style="margin-top:22px;">TOP TAGS</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          ${tags.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
    </div>
    <div class="panel chart-panel" style="margin-top:20px;">
      <div class="section-title">FEEDBACK VOLUME — LAST 12 WEEKS</div>
      <svg viewBox="0 0 570 90" width="100%" height="110" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="#d4a853" stroke-width="2"/>
        ${TREND.map((v, i) => `<circle cx="${(i / (TREND.length - 1)) * 560}" cy="${70 - (v / maxT) * 60}" r="2.6" fill="#d4a853"/>`).join('')}
      </svg>
    </div>
  `;
    }

    /* ============================= AI ASSISTANT PAGE ============================= */
    function pageAssistant() {
      if (state.chatHistory.length === 0) {
        state.chatHistory.push({ role: 'assistant', content: "I'm the Evidence Board assistant. Ask me about open cases, root causes, or what to prioritize next — I have context on all 6 active cases and the linked evidence." });
      }
      return `
    <div class="chat-wrap">
      <div class="chat-messages" id="chat-messages">
        ${state.chatHistory.map(m => `
          <div class="msg ${m.role === 'user' ? 'user' : 'assistant'}">
            <div class="msg-meta">${m.role === 'user' ? 'YOU' : 'EVIDENCE BOARD AI'}</div>
            <div>${escapeHtml(m.content).replace(/\n/g, '<br>')}</div>
          </div>`).join('')}
        <div id="typing-indicator" style="display:none;" class="msg assistant">
          <div class="msg-meta">EVIDENCE BOARD AI</div>
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="chat-suggest">
        <div class="suggest-chip" data-q="Which case should we fix first and why?">Which case first?</div>
        <div class="suggest-chip" data-q="Summarize the Payment Failure case in two sentences.">Summarize Payment Failure</div>
        <div class="suggest-chip" data-q="What's driving the recurrence score on Login / Authentication Failure?">Explain recurrence score</div>
      </div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="Ask about a case, an exhibit, or what to prioritize..."></textarea>
        <button class="btn btn-teal" id="chat-send">Send</button>
      </div>
    </div>
  `;
    }

    function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    function renderChatMessages() {
      const box = document.getElementById('chat-messages');
      const typing = document.getElementById('typing-indicator');
      if(!box || !typing) return;
      box.querySelectorAll('.msg:not(#typing-indicator)').forEach(el => el.remove());
      state.chatHistory.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
        div.innerHTML = `<div class="msg-meta">${m.role === 'user' ? 'YOU' : 'EVIDENCE BOARD AI'}</div><div>${escapeHtml(m.content).replace(/\\n/g, '<br>')}</div>`;
        box.insertBefore(div, typing);
      });
      box.scrollTop = box.scrollHeight;
    }

    /* ============================= UPLOAD PAGE ============================= */
    function pageUpload() {
      return `
    <div style="max-width:820px;">
      <div class="panel" style="padding:26px;">
        <div style="margin-bottom:18px;">
          <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;font-family:'Source Serif 4', serif;">Feedback File Ingestion & Automatic Analysis</div>
          <div style="font-size:11.5px;color:var(--text-dim);line-height:1.5;">
            Uploaded files are immediately parsed, ingested into the platform, and automatically analyzed through the LangGraph pipeline (Clustering → Root Cause → Evidence Testing → Prioritization).
          </div>
        </div>

        <div class="dropzone" id="dropzone" style="cursor:pointer;">
          ${ICONS.upload.replace('width="24" height="24"', 'width="36" height="36"').replace('stroke-width="1.6"', 'stroke-width="1.3"')}
          <div class="dz-title">Drop feedback exports here or click to browse</div>
          <div class="dz-sub">Supports JSON, CSV, or TXT exports from support tickets, app reviews, surveys & surveys · up to 20MB</div>
          <div style="margin-top:14px;display:flex;gap:10px;justify-content:center;align-items:center;">
            <button type="button" class="btn btn-teal btn-sm" id="btn-browse-dropzone" onclick="document.getElementById('file-input').click(); event.stopPropagation();">Select File</button>
            <button type="button" class="btn btn-solid btn-sm" id="btn-sample-upload" onclick="loadSampleDataset(event)">Load Sample Dataset</button>
          </div>
        </div>
        <input type="file" id="file-input" multiple accept=".json,.csv,.txt" style="display:none">
        
        <div id="file-list" style="margin-top:14px;"></div>
      </div>

      <div id="analysis-results-container" style="margin-top:18px;"></div>
    </div>
  `;
    }

    function humanSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function parseFileContent(filename, text) {
      const ext = (filename.split('.').pop() || '').toLowerCase();
      const feedback = [];
      const operational_metrics = [];

      // 1. JSON Parsing
      if (ext === 'json' || text.trim().startsWith('{') || text.trim().startsWith('[')) {
        try {
          const data = JSON.parse(text);
          if (data && typeof data === 'object' && !Array.isArray(data)) {
            if (Array.isArray(data.feedback)) {
              data.feedback.forEach(item => {
                if (typeof item === 'string') {
                  feedback.push({ channel: 'survey', text: item });
                } else if (item && item.text) {
                  feedback.push({
                    text: String(item.text),
                    channel: item.channel || 'survey',
                    customer_id: item.customer_id || null,
                    category: item.category || null,
                    timestamp: item.timestamp || null
                  });
                }
              });
            }
            if (Array.isArray(data.operational_metrics)) {
              data.operational_metrics.forEach(m => {
                if (m && m.name && m.baseline !== undefined && m.current !== undefined) {
                  operational_metrics.push({
                    name: String(m.name),
                    baseline: Number(m.baseline),
                    current: Number(m.current),
                    unit: String(m.unit || '')
                  });
                }
              });
            }
          } else if (Array.isArray(data)) {
            data.forEach(item => {
              if (typeof item === 'string') {
                feedback.push({ channel: 'survey', text: item });
              } else if (item && typeof item === 'object') {
                const txt = item.text || item.comment || item.feedback || item.review || item.message;
                if (txt) {
                  feedback.push({
                    text: String(txt),
                    channel: item.channel || item.source || 'survey',
                    customer_id: item.customer_id || item.user_id || null,
                    category: item.category || null,
                    timestamp: item.timestamp || null
                  });
                } else if (item.name && item.baseline !== undefined && item.current !== undefined) {
                  operational_metrics.push({
                    name: String(item.name),
                    baseline: Number(item.baseline),
                    current: Number(item.current),
                    unit: String(item.unit || '')
                  });
                }
              }
            });
          }
          if (feedback.length > 0 || operational_metrics.length > 0) {
            return { feedback, operational_metrics };
          }
        } catch (err) {
          console.warn('JSON parse attempt failed, trying CSV/TXT...', err);
        }
      }

      // 2. CSV Parsing
      if (ext === 'csv' || text.includes(',')) {
        try {
          const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (lines.length > 0) {
            function parseCsvLine(line) {
              const res = [];
              let cur = '';
              let inQuotes = false;
              for (let i = 0; i < line.length; i++) {
                const c = line[i];
                if (c === '"') {
                  if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
                  else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                  res.push(cur.trim());
                  cur = '';
                } else {
                  cur += c;
                }
              }
              res.push(cur.trim());
              return res;
            }

            const rawHeaders = parseCsvLine(lines[0]);
            const headers = rawHeaders.map(h => h.toLowerCase().replace(/[\s_-]+/g, ''));
            const hasTextHeader = headers.some(h => ['text', 'feedback', 'comment', 'review', 'message', 'content', 'description'].includes(h));
            const hasMetricHeader = headers.includes('baseline') && headers.includes('current') && (headers.includes('name') || headers.includes('metric'));

            if (hasTextHeader || hasMetricHeader) {
              for (let i = 1; i < lines.length; i++) {
                const values = parseCsvLine(lines[i]);
                if (values.length === 0 || values.every(v => !v)) continue;
                const row = {};
                headers.forEach((h, idx) => { row[h] = values[idx] || ''; });

                if (hasMetricHeader && row['baseline'] && row['current']) {
                  operational_metrics.push({
                    name: row['name'] || row['metric'] || `metric_${i}`,
                    baseline: parseFloat(row['baseline']) || 0,
                    current: parseFloat(row['current']) || 0,
                    unit: row['unit'] || ''
                  });
                } else {
                  const txt = row['text'] || row['feedback'] || row['comment'] || row['review'] || row['message'] || row['content'] || row['description'];
                  if (txt) {
                    feedback.push({
                      text: txt,
                      channel: row['channel'] || row['source'] || row['type'] || 'survey',
                      customer_id: row['customerid'] || row['userid'] || row['id'] || null,
                      category: row['category'] || row['topic'] || null,
                      timestamp: row['timestamp'] || row['date'] || null
                    });
                  }
                }
              }
              if (feedback.length > 0 || operational_metrics.length > 0) {
                return { feedback, operational_metrics };
              }
            }
          }
        } catch (err) {
          console.warn('CSV parse attempt failed, trying TXT...', err);
        }
      }

      // 3. TXT Fallback (line by line)
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      lines.forEach(line => {
        if (line.length > 2) {
          feedback.push({ channel: 'survey', text: line });
        }
      });

      return { feedback, operational_metrics };
    }

    async function loadSampleDataset(e) {
      if (e) e.stopPropagation();
      const entry = {
        id: 'sample_' + Date.now(),
        name: 'sample_dataset.json',
        size: 1628,
        status: 'processing',
        progress: 20,
        statusText: 'Reading sample dataset...',
        result: null,
        error: null
      };
      state.uploadedFiles.unshift(entry);
      renderFileList();

      try {
        entry.progress = 40;
        entry.statusText = 'Ingesting feedback & operational metrics...';
        renderFileList();

        const res = await fetch("http://127.0.0.1:8000/seed", { method: "POST" });
        if (!res.ok) throw new Error("Seed API failed");
        
        entry.progress = 75;
        entry.statusText = 'Running LangGraph analysis pipeline...';
        renderFileList();

        const aRes = await fetch("http://127.0.0.1:8000/analyze", { method: "POST" });
        if (!aRes.ok) throw new Error("Analysis API failed");
        const aData = await aRes.json();

        entry.status = 'done';
        entry.progress = 100;
        entry.statusText = 'Analyzed & linked to cases';
        entry.result = {
          feedbackCount: 17,
          metricsCount: 13,
          issuesCount: aData.issues_created_or_updated || (aData.issues ? aData.issues.length : 0),
          issues: aData.issues || []
        };
        renderFileList();
        renderAnalysisResults(entry);
        await fetchData();
      } catch (err) {
        console.error("Sample dataset error:", err);
        entry.status = 'error';
        entry.progress = 100;
        entry.statusText = 'Error: ' + err.message;
        entry.error = err.message;
        renderFileList();
      }
    }

    function handleFiles(fileList) {
      if (!fileList || fileList.length === 0) return;

      Array.from(fileList).forEach(f => {
        const entry = {
          id: 'f_' + Math.random().toString(36).substr(2, 9),
          name: f.name,
          size: f.size,
          status: 'processing',
          progress: 25,
          statusText: 'Reading & parsing file...',
          result: null,
          error: null
        };
        state.uploadedFiles.unshift(entry);
        renderFileList();

        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const rawText = e.target.result;
            const parsed = parseFileContent(f.name, rawText);

            if ((!parsed.feedback || parsed.feedback.length === 0) && (!parsed.operational_metrics || parsed.operational_metrics.length === 0)) {
              throw new Error("No readable feedback or operational metrics found in file.");
            }

            entry.progress = 50;
            entry.statusText = `Ingesting ${parsed.feedback.length} exhibits & ${parsed.operational_metrics.length} metrics...`;
            renderFileList();

            const ingestRes = await fetch("http://127.0.0.1:8000/ingest?auto_analyze=true", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(parsed)
            });

            if (!ingestRes.ok) {
              const errData = await ingestRes.json().catch(() => ({}));
              throw new Error(errData.detail || "Server ingestion failed");
            }

            const ingestData = await ingestRes.json();

            let issues = ingestData.issues || [];
            if (!ingestData.auto_analyzed || issues.length === 0) {
              entry.progress = 80;
              entry.statusText = "Running LangGraph multi-agent analysis...";
              renderFileList();

              const analyzeRes = await fetch("http://127.0.0.1:8000/analyze", { method: "POST" });
              if (analyzeRes.ok) {
                const analyzeData = await analyzeRes.json();
                issues = analyzeData.issues || [];
              }
            }

            entry.status = 'done';
            entry.progress = 100;
            entry.statusText = 'Analyzed & linked to cases';
            entry.result = {
              feedbackCount: parsed.feedback.length,
              metricsCount: parsed.operational_metrics.length,
              issuesCount: issues.length,
              issues: issues
            };

            renderFileList();
            renderAnalysisResults(entry);
            await fetchData();
          } catch (err) {
            console.error("Upload error", err);
            entry.status = 'error';
            entry.progress = 100;
            entry.statusText = 'Failed: ' + err.message;
            entry.error = err.message;
            renderFileList();
          }
        };

        reader.onerror = () => {
          entry.status = 'error';
          entry.progress = 100;
          entry.statusText = 'Failed to read file';
          entry.error = 'Could not read file from disk';
          renderFileList();
        };

        reader.readAsText(f);
      });
    }

    function renderFileList() {
      const list = document.getElementById('file-list');
      if (!list) return;
      if (state.uploadedFiles.length === 0) { list.innerHTML = ''; return; }

      list.innerHTML = state.uploadedFiles.map(f => {
        let statusBadgeClass = 'fs-queued';
        let statusLabel = f.statusText || 'Queued';

        if (f.status === 'processing') {
          statusBadgeClass = 'fs-processing';
        } else if (f.status === 'done') {
          statusBadgeClass = 'fs-done';
          statusLabel = '✓ ' + (f.statusText || 'Analysis Complete');
        } else if (f.status === 'error') {
          statusBadgeClass = 'fs-error';
          statusLabel = '✕ ' + (f.statusText || 'Failed');
        }

        return `
        <div class="file-row">
          <div style="flex:1;min-width:0;padding-right:16px;">
            <div class="fname" style="font-weight:500;">${escapeHtml(f.name)}</div>
            <div class="fsize">${humanSize(f.size)}${f.result ? ` · ${f.result.feedbackCount} feedback exhibits · ${f.result.issuesCount} cases generated` : ''}</div>
            ${f.status === 'processing' ? `
              <div style="display:flex;align-items:center;gap:10px;margin-top:6px;">
                <div class="progress-track"><div class="progress-fill" style="width:${f.progress}%"></div></div>
                <span style="font-size:10px;color:var(--blue);">${f.statusText}</span>
              </div>` : ''}
            ${f.error ? `<div style="font-size:11px;color:var(--red);margin-top:4px;">${escapeHtml(f.error)}</div>` : ''}
          </div>
          <span class="file-status ${statusBadgeClass}">
            ${escapeHtml(statusLabel)}
          </span>
        </div>
      `;
      }).join('');
    }

    function renderAnalysisResults(entry) {
      const container = document.getElementById('analysis-results-container');
      if (!container || !entry || !entry.result) return;

      const res = entry.result;
      const issues = res.issues || CASES || [];

      container.innerHTML = `
        <div class="analysis-result-card success">
          <div class="analysis-badge-header">
            <div class="analysis-title">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--green)" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
              <span>LangGraph Analysis Completed for <em>${escapeHtml(entry.name)}</em></span>
            </div>
            <span class="badge badge-low" style="border-color:rgba(124, 174, 130, 0.45);color:var(--green);">Pipeline Finished</span>
          </div>

          <div class="analysis-meta-row">
            <div class="analysis-meta-item">Feedback Exhibits Ingested: <strong>${res.feedbackCount}</strong></div>
            <div class="analysis-meta-item">Operational Metrics: <strong>${res.metricsCount}</strong></div>
            <div class="analysis-meta-item">Cases Identified / Updated: <strong>${res.issuesCount}</strong></div>
          </div>

          ${issues.length > 0 ? `
            <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;font-weight:600;letter-spacing:0.04em;">DISCOVERED PRIORITY CASES:</div>
            <div class="analysis-cases-list">
              ${issues.map(iss => `
                <div class="analysis-case-item" onclick="navigateToCase('${iss.issue_id}')">
                  <div class="analysis-case-title">
                    <span class="case-id-tag">${iss.issue_id}</span>
                    <span>${escapeHtml(iss.label)}</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:8px;">
                    <span class="badge ${badgeClass(iss.priority_label)}">${iss.priority_label} · ${iss.priority_score ? iss.priority_score.toFixed(1) : '0'}</span>
                    <span style="font-size:10.5px;color:var(--text-dim);">${iss.feedback_count} exhibits</span>
                    <span style="color:var(--gold);font-size:12px;">→</span>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : '<div style="color:var(--text-dim);font-size:12px;margin:8px 0;">No active cases produced from this feedback.</div>'}

          <div class="analysis-actions">
            <button class="btn btn-teal btn-sm" onclick="navigateToBacklog()">View in Priority Backlog →</button>
            <button class="btn btn-solid btn-sm" onclick="navigateToDashboard()">Open Dashboard →</button>
          </div>
        </div>
      `;
    }

    function navigateToCase(issueId) {
      state.selectedCase = issueId;
      state.page = 'cases';
      route();
    }

    function navigateToBacklog() {
      state.page = 'cases';
      route();
    }

    function navigateToDashboard() {
      state.page = 'dashboard';
      route();
    }

    /* ============================= SETTINGS PAGE ============================= */
    function pageSettings() {
      return `
    <div class="settings-grid">
      <div>
        <div class="field">
          <label>WORKSPACE ENDPOINT</label>
          <input type="text" value="http://127.0.0.1:8000">
        </div>
        <div class="field">
          <label>WEBHOOK URL FOR NEW CASES</label>
          <input type="text" placeholder="https://hooks.example.com/evidence-board">
        </div>
        <div class="field">
          <label>DEFAULT PRIORITY THRESHOLD</label>
          <input type="text" value="60.0">
        </div>
      </div>
      <div>
        <div class="toggle-row">
          <div><div class="t-title">Auto-run analysis on new feedback</div><div class="t-sub">Recompute priority scores as evidence arrives</div></div>
          <div class="switch on" data-toggle></div>
        </div>
        <div class="toggle-row">
          <div><div class="t-title">Notify on critical severity</div><div class="t-sub">Send an alert the moment a case crosses critical</div></div>
          <div class="switch on" data-toggle></div>
        </div>
        <div class="toggle-row">
          <div><div class="t-title">Weekly digest email</div><div class="t-sub">Summary of open cases every Monday</div></div>
          <div class="switch" data-toggle></div>
        </div>
        <div class="toggle-row" style="border-bottom:none;">
          <div><div class="t-title">Share anonymized exhibits with AI assistant</div><div class="t-sub">Let the assistant reference exact quotes when answering</div></div>
          <div class="switch on" data-toggle></div>
        </div>
      </div>
    </div>
  `;
    }

    /* ============================= EVENT WIRING ============================= */
    function afterRender() {
      document.querySelectorAll('[data-case]').forEach(el => {
        el.addEventListener('click', () => { state.selectedCase = el.getAttribute('data-case'); route(); });
      });
      const resetBtn = document.getElementById('btn-reset');
      if (resetBtn) resetBtn.addEventListener('click', () => { state.selectedCase = CASES[0]?.issue_id || null; route(); });

      if (state.page === 'assistant') {
        const chatSendBtn = document.getElementById('chat-send');
        if (chatSendBtn) chatSendBtn.addEventListener('click', typeof sendChat === 'function' ? sendChat : () => alert('sendChat missing'));
        const ta = document.getElementById('chat-input');
        if (ta) ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (typeof sendChat === 'function') sendChat(); } });
        document.querySelectorAll('.suggest-chip').forEach(el => {
          el.addEventListener('click', () => { document.getElementById('chat-input').value = el.getAttribute('data-q'); if (typeof sendChat === 'function') sendChat(); });
        });
        document.getElementById('chat-messages').scrollTop = 999999;
        const clearBtn = document.getElementById('btn-clear-chat');
        if (clearBtn) clearBtn.addEventListener('click', () => { state.chatHistory = []; route(); });
      }

      if (state.page === 'upload') {
        const dz = document.getElementById('dropzone');
        const fi = document.getElementById('file-input');
        if (dz && fi) {
          dz.addEventListener('click', () => fi.click());
          fi.addEventListener('change', e => handleFiles(e.target.files));
          dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
          dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
          dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); handleFiles(e.dataTransfer.files); });
        }
        const browseBtn = document.getElementById('btn-browse');
        if (browseBtn && fi) browseBtn.addEventListener('click', () => fi.click());
        renderFileList();
      }

      if (state.page === 'settings') {
        document.querySelectorAll('[data-toggle]').forEach(el => {
          el.addEventListener('click', () => el.classList.toggle('on'));
        });
      }
    }

    fetchData();
  </script>
